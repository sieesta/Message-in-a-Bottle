<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message in a Bottle | Preserve Today. Reflect Tomorrow.</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body class="landing-page">
    <div class="particles-container" id="particles"></div>
    
    <nav class="glass-nav">
        <div class="logo">Message in a Bottle</div>
        <div class="nav-links">
            <a href="login.html" class="btn-ghost">Log In</a>
            <a href="login.html?signup=true" class="btn-primary">Start Your Journey</a>

    <main class="hero">
        <div class="hero-content glass-card">

        <div class="hero-visual">
            <div class="floating-bottle">
                <!-- SVG or Image of a bottle would go here -->

                    <div class="message-scroll"></div>

        </div>

    <script src="js/main.js"></script>
