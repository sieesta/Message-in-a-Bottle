<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bottle | Message in a Bottle</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/create.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="create-page">
    <div class="particles-container" id="particles"></div>
    
    <nav class="glass-nav">
        <a href="dashboard.html" class="logo" style="text-decoration:none; color:inherit;">Message in a Bottle</a>
        <div class="nav-links">
            <a href="dashboard.html" class="btn-ghost">Cancel</a>
        </div>
    </nav>

    <main class="create-container">
        <div class="glass-card create-form-wrapper">
            <h2>Seal a New Memory</h2>
            <form id="createBottleForm">
                <div class="form-group">
                    <label for="bottleTitle">Title</label>
                    <input type="text" id="bottleTitle" placeholder="A note for my 30th birthday..." required>
                </div>
                
                <div class="form-group">
                    <label for="bottleMessage">Your Message</label>
                    <textarea id="bottleMessage" rows="8" placeholder="Dear future me..." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="moodSelect">Current Mood</label>
                        <select id="moodSelect" required>
                            <option value="happy">Happy</option>
                            <option value="calm" selected>Calm</option>
                            <option value="sad">Sad/Melancholic</option>
                            <option value="hopeful">Hopeful</option>
                            <option value="romantic">Romantic</option>
                        </select>
                    </div>
                    
                    <div class="form-group half">
                        <label for="unlockDate">Unlock Date</label>
                        <input type="date" id="unlockDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Attach a Song</label>
                    <div class="spotify-search-container">
                        <input type="text" id="spotifySearchInput" placeholder="Search and select your song..." autocomplete="off">
                        <div class="spotify-search-results" id="spotifySearchResults">
                            <!-- Results inject here -->
                        </div>
                    </div>
                    <input type="hidden" id="spotifyTrackUrl" name="spotifyTrackUrl">
                    <div id="selectedSongDisplay" class="selected-song-display">
                        <img src="" alt="Album Art" id="selectedSongImg">
                        <div class="selected-song-info">
                            <strong id="selectedSongTitle">Song Title</strong>
                            <span id="selectedSongArtist">Artist</span>
                        </div>
                        <button type="button" id="removeSongBtn" class="btn-ghost" title="Remove Song">×</button>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary seal-btn">Seal this Bottle</button>
            </form>
        </div>
        
        <div class="preview-container">
            <div class="floating-bottle preview-bottle">
                <div class="bottle-glow"></div>
                <div class="bottle-shape"></div>
            </div>
            <p style="text-align:center; margin-top:1rem; opacity:0.8;">Live Preview</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/main.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/music.js"></script>
    <script src="js/create.js"></script>
</body>
</html>
