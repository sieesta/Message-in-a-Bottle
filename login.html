<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth | Message in a Bottle</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.3);
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            background: rgba(255, 255, 255, 0.6);
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .btn-auth {
            width: 100%;
            margin-top: 1rem;
        }
        .auth-switch {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .auth-switch a {
            color: #4a6fa5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="particles-container" id="particles"></div>
    
    <nav class="glass-nav">
        <a href="index.html" class="logo" style="text-decoration:none; color:inherit;">Message in a Bottle</a>
    </nav>

    <main class="auth-container">
        <div class="glass-card auth-card">
            <h2 id="authTitle" style="margin-bottom: 1.5rem;">Welcome Back</h2>
            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label for="username">Name</label>
                    <input type="text" id="username" placeholder="Your beautiful name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary btn-auth">Log In</button>
            </form>
            <div class="auth-switch">
                <span id="authText">Don't have an account?</span> 
                <a href="#" id="toggleAuth">Sign up</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/main.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
