<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bottle | Message in a Bottle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css?v=3">
    <style>
        .viewer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8rem 2rem 2rem 2rem; /* Added top padding so it isn't blocked by the sticky nav */
            flex-direction: column;
        }

        .bottle-presentation {
            text-align: center;
            animation: fadeIn 1.5s ease;
        }

        .bottle-message-card {
            max-width: 600px;
            width: 100%;
            margin-top: 2rem;
            display: none; /* Hidden until unlocked */
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }

        .bottle-message-card.revealed {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .bottle-message-card h2 {
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .message-content {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            font-style: italic;
            white-space: pre-wrap;
        }

        #countdown {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 1.5rem 0;
            letter-spacing: 2px;
        }

        .spotify-container {
            margin-top: 1.5rem;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Bottle Opening Animations */
        @keyframes popCork {
            0% { transform: translateX(-50%) translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateX(-50%) translateY(-200px) rotate(120deg); opacity: 0; }
        }
        @keyframes vanishBottle {
            0% { transform: scale(1); opacity: 1; filter: blur(0); }
            100% { transform: scale(4); opacity: 0; filter: blur(20px); }
        }
        .bottle-opening::before {
            animation: popCork 0.8s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
        }
        .bottle-vanish {
            animation: vanishBottle 1.2s forwards ease-in 0.4s !important; 
        }
        
        /* Smooth Background Transition */
        #moodBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: -2;
            pointer-events: none;
        }
        
        .bottle-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: transparent;
            z-index: 1;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
    </style>
</head>
<body class="viewer-page">
    <div id="moodBg"></div>
    <div class="particles-container" id="particles"></div>
    
    <nav class="glass-nav">
        <a href="dashboard.html" class="logo" style="text-decoration:none; color:inherit;">Message in a Bottle</a>
        <div class="nav-links">
            <a href="dashboard.html" class="btn-ghost">Back to Dashboard</a>
        </div>
    </nav>

    <main class="viewer-container">
        
        <div class="bottle-presentation" id="lockedState">
            <div class="bottle-scaler" style="margin: 3rem auto; display: flex; justify-content: center; height: 400px; transform: scale(1);">
                <div class="floating-bottle" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 1.5rem 2rem 1.5rem; box-sizing: border-box; text-align: center;">
                    <div class="bottle-glow"></div>
                    <div class="bottle-shape"></div>
                    
                    <h2 style="position: relative; z-index: 10; font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.25rem; font-weight: 500; color: #000; line-height: 1.5; text-shadow: none;">This memory<br>is sealed.</h2>
                    <div id="countdown" style="position: relative; z-index: 10; font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; letter-spacing: 1px; margin: 1.2rem 0; color: #000; text-shadow: none;">Unlocking soon...</div>
                    <button id="openBtn" class="btn-primary" style="position: relative; z-index: 10; display:none; margin-top: 0.5rem; padding: 0.4rem 1.2rem; font-family: 'Playfair Display', serif; font-size: 0.95rem; border-radius: 30px; background: transparent; color: #000; border: 1.5px solid #000; box-shadow: none; font-weight: 700;">Break the Seal</button>
                </div>
            </div>
        </div>

        <div class="glass-card bottle-message-card" id="unlockedState">
            <h2 id="viewTitle" style="color: #000;">My 30th Birthday</h2>
            <p class="message-content" id="viewMessage" style="color: #000;">
Dear future me,

I hope you're doing well. Remember when you built this app in 2024? Keep shining, and keep preserving your memories.

With love,
Past Me
            </p>
            
            <div class="spotify-container" id="spotifyPlayer">
                <!-- Spotify embed injected here -->
            </div>
            
            <div style="text-align: center; margin-top: 2.5rem; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 1.5rem;">
                <button id="deleteBtn" class="btn-ghost" style="color: #d90429; border-color: rgba(217, 4, 41, 0.3); font-size: 0.9rem;">Clean up Memory</button>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/main.js"></script>
    <script src="js/music.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const lockedState = document.getElementById('lockedState');
            const unlockedState = document.getElementById('unlockedState');
            const openBtn = document.getElementById('openBtn');
            const spotifyPlayer = document.getElementById('spotifyPlayer');
            const countdownEl = document.getElementById('countdown');
            
            // Get bottle ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const bottleId = urlParams.get('id');
            
            if (!bottleId) {
                countdownEl.innerHTML = "No bottle selected.";
                return;
            }
            
            // Check auth
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }

            // Fetch actual bottle
            const { data: bottle, error } = await supabaseClient
                .from('bottles')
                .select('*')
                .eq('id', bottleId)
                .single();

            if (error || !bottle) {
                countdownEl.innerHTML = "Bottle not found or access denied.";
                return;
            }
            
            const bgColors = {
                happy: 'linear-gradient(135deg, #ffb703 0%, #fb8500 100%)',
                sad: 'linear-gradient(135deg, #003566 0%, #023e8a 100%)',
                calm: 'linear-gradient(135deg, #8ecae6 0%, #219ebc 100%)',
                hopeful: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)',
                romantic: 'linear-gradient(135deg, #ffafcc 0%, #ffc8dd 100%)'
            };
            
            const bottleTints = {
                happy: 'linear-gradient(135deg, rgba(255, 183, 3, 0.5) 0%, rgba(251, 133, 0, 0.5) 100%)',
                sad: 'linear-gradient(135deg, rgba(0, 53, 102, 0.5) 0%, rgba(2, 62, 138, 0.5) 100%)',
                calm: 'linear-gradient(135deg, rgba(142, 202, 230, 0.5) 0%, rgba(33, 158, 188, 0.5) 100%)',
                hopeful: 'linear-gradient(135deg, rgba(168, 237, 234, 0.5) 0%, rgba(254, 214, 227, 0.5) 100%)',
                romantic: 'linear-gradient(135deg, rgba(255, 175, 204, 0.5) 0%, rgba(255, 200, 221, 0.5) 100%)'
            };
            
            if (bottle && bottle.mood && bottleTints[bottle.mood]) {
                const glow = document.querySelector('.bottle-glow');
                const neck = document.querySelector('.bottle-shape');
                
                if (glow) {
                    glow.style.background = bottleTints[bottle.mood];
                    // Fade in the colored tint smoothly
                    setTimeout(() => glow.style.opacity = '1', 100);
                }
                
                if (neck) {
                    neck.style.transition = 'background 2s ease-in-out';
                    setTimeout(() => {
                        neck.style.background = bottleTints[bottle.mood];
                    }, 100);
                }
            }
            
            const unlockDate = new Date(bottle.unlock_date);
            const musicDataStr = bottle.spotify_url; // It's our JSON string
            
            document.getElementById('viewTitle').textContent = bottle.title;
            document.getElementById('viewMessage').textContent = bottle.message;
            
            const interval = setInterval(() => {
                const now = new Date().getTime();
                const distance = unlockDate.getTime() - now;
                
                if (distance <= 0) {
                    clearInterval(interval);
                    countdownEl.innerHTML = "The time has come.";
                    openBtn.style.display = 'inline-block';
                    
                    // Mark as opened in DB if not already
                    if (!bottle.opened) {
                        supabaseClient.from('bottles').update({ opened: true }).eq('id', bottle.id).then();
                    }
                } else {
                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    countdownEl.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
                }
            }, 1000);
            
            // Run immediately once so we don't wait 1s
            const initialDistance = unlockDate.getTime() - new Date().getTime();
            if(initialDistance <= 0) {
                 clearInterval(interval);
                 countdownEl.innerHTML = "The time has come.";
                 openBtn.style.display = 'inline-block';
            }
            
            openBtn.addEventListener('click', () => {
                // 1. Focus entirely on the bottle by hiding the text and button
                openBtn.style.display = 'none';
                countdownEl.style.display = 'none';
                document.querySelector('#lockedState h2').style.display = 'none';
                
                // 2. Trigger the "opening" animations on the CSS
                const bottleScaler = document.querySelector('.bottle-scaler');
                bottleScaler.classList.add('bottle-vanish');
                
                const bottleImg = document.querySelector('.floating-bottle');
                bottleImg.classList.add('bottle-opening');
                
                // 3. Wait for animation to finish before transitioning into the inner memory
                setTimeout(() => {
                    lockedState.style.display = 'none';
                    
                    // Add Music Player
                    if(musicDataStr) {
                        spotifyPlayer.innerHTML = getMusicEmbedPlayer(musicDataStr);
                        
                        // Force background music to play immediately on click
                        setTimeout(() => {
                            const audio = document.getElementById('bottleAudio');
                            if (audio) {
                                audio.volume = 0.4; // 40% volume for a smoother background vibe
                                audio.play().catch(e => console.log("Autoplay blocked:", e));
                            }
                        }, 50);
                    }
                    
                    unlockedState.classList.add('revealed');
                    
                    // Change background to reflect mood so bubbles remain visible against color
                    if (bottle && bottle.mood && bgColors[bottle.mood]) {
                        const moodBg = document.getElementById('moodBg');
                        if (moodBg) {
                            moodBg.style.background = bgColors[bottle.mood];
                            // Request a tiny delay so the background renders before fading in
                            setTimeout(() => moodBg.style.opacity = '1', 50);
                        } else {
                            document.body.style.background = bgColors[bottle.mood];
                        }
                    }
                }, 1600); // 1.6 second animation wait time
            });

            // Delete functionality
            const deleteBtn = document.getElementById('deleteBtn');
            deleteBtn.addEventListener('click', async () => {
                if (confirm("Are you sure you want to delete this memory permanently?")) {
                    deleteBtn.innerHTML = "Deleting...";
                    deleteBtn.disabled = true;
                    // Delete from Supabase Database completely
                    await supabaseClient.from('bottles').delete().eq('id', bottle.id);
                    // Navigate back to user Dashboard
                    window.location.href = 'dashboard.html';
                }
            });
        });
    </script>
</body>
</html>
